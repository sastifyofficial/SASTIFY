<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f0f2f5;color:#1c1e21;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;display:flex;flex-direction:column}.nav{height:68px;background:#fff;border-bottom:1px solid #e2e5e9;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100% - 1050px)/2))}.brand{font-size:26px;font-weight:850;letter-spacing:-1px;color:#0866ff;text-decoration:none}.home{color:#0866ff;text-decoration:none;font-size:14px;font-weight:700}.main{flex:1;display:grid;place-items:center;padding:36px 16px}.card{width:min(430px,100%);background:#fff;border:1px solid #e0e3e8;border-radius:14px;padding:32px;box-shadow:0 10px 30px #1720330b}.mark{width:48px;height:48px;border-radius:14px;background:#0866ff;color:#fff;display:grid;place-items:center;font-size:29px;font-weight:850;margin:0 auto 18px}.card h1{text-align:center;font-size:27px;letter-spacing:-.8px;margin:0 0 7px}.sub{text-align:center;color:#69717d;font-size:14px;margin:0 0 25px}.field{margin:16px 0}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:7px}.field input{width:100%;height:47px;border:1px solid #d5dae2;border-radius:8px;padding:0 13px;font:inherit;font-size:14px;outline:none}.field input:focus{border-color:#0866ff;box-shadow:0 0 0 3px #0866ff18}.submit{width:100%;height:48px;border:0;border-radius:8px;background:#0866ff;color:#fff;font-size:15px;font-weight:750;cursor:pointer;margin-top:7px}.submit:disabled{opacity:.65;cursor:wait}.links{display:flex;justify-content:space-between;gap:12px;margin-top:18px}.links a,.links button{font-size:13px;color:#0866ff;text-decoration:none;font-weight:700;background:none;border:0;padding:0;cursor:pointer}.notice{display:none;margin-top:16px;padding:12px;border-radius:8px;background:#fff0ed;color:#a02a19;font-size:13px;line-height:1.5}.signup{text-align:center;color:#69717d;font-size:13px;margin:24px 0 0}.signup a{color:#0866ff;text-decoration:none;font-weight:750}footer{text-align:center;padding:20px;color:#7b828d;font-size:12px}@media(max-width:480px){.card{padding:27px 21px}.nav{height:62px}}
:root{--auth-blue:#1877f2;--auth-ink:#172235}body{background:radial-gradient(ellipse at 12% 12%,#dceaff 0,transparent 34%),radial-gradient(ellipse at 90% 88%,#e4edff 0,transparent 34%),#f5f8fd;color:var(--auth-ink)}.nav{height:76px;background:#ffffffdf;backdrop-filter:blur(16px);border-bottom:1px solid #e7edf6}.brand{font-size:29px;letter-spacing:-1.4px;font-weight:900}.home{padding:10px 15px;border:1px solid #dce7f7;border-radius:999px;background:#fff}.main{padding:42px 16px}.card{width:min(460px,100%);padding:38px 38px 32px;border:1px solid #dae4f2;border-radius:24px;box-shadow:0 24px 70px #17345b12;position:relative;overflow:hidden}.card:before,.card:after{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,#0866ff,#63a3ff,#0866ff)}.mark{width:62px;height:62px;border-radius:19px;background:linear-gradient(145deg,#0866ff,#3990ff);box-shadow:0 9px 22px #0866ff35;font-size:35px;margin-bottom:22px}.card h1{font-size:30px;letter-spacing:-1.1px;font-weight:850}.sub{color:#748197;margin-bottom:29px}.field{margin:19px 0}.field label{color:#26364c;margin-bottom:8px}.field input{height:51px;border:1px solid #dce3ed;border-radius:11px;padding:0 14px;background:#fbfcfe;transition:.18s}.field input:focus{background:#fff;border-color:#1877f2;box-shadow:0 0 0 4px #1877f21a}.password-wrap{position:relative}.password-wrap input{width:100%;padding-right:75px}.password-toggle{position:absolute;right:9px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#1877f2;font-size:12px;font-weight:800;padding:8px;cursor:pointer}.submit{height:52px;border-radius:11px;background:linear-gradient(100deg,#0866ff,#2786ff);box-shadow:0 8px 18px #0866ff2b;transition:.18s}.submit:hover{transform:translateY(-1px);box-shadow:0 11px 23px #0866ff38}.links{margin-top:20px}.signup{border-top:1px solid #edf0f5;padding-top:21px;margin-top:25px}footer{color:#8792a3}#authToast{position:fixed;z-index:9999;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);width:min(340px,calc(100% - 36px));padding:17px 18px 17px 56px;border:1px solid #e5eaf2;border-radius:18px;background:#fffffff5;backdrop-filter:blur(18px);box-shadow:0 18px 55px #10213b30;color:#172235;opacity:0;visibility:hidden;transition:.2s;pointer-events:none}#authToast.show{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}#authToast:before{content:"✓";position:absolute;left:17px;top:50%;transform:translateY(-50%);width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#e8f8ee;color:#159447;font-weight:900}#authToast.error:before{content:"!";background:#fff0ed;color:#d34232}#authToast b{display:block;margin-bottom:3px}#authToast span{font-size:13px;color:#596579}@media(max-width:520px){.nav{height:66px;padding:0 17px}.main{padding:28px 14px}.card{padding:33px 23px 26px;border-radius:20px}.card h1{font-size:27px}}</style>
<link rel="stylesheet" href="/assets/sastify-typography.css?v=1">
</head>
<body>
<header class="nav"><a class="brand" href="/">SASTIFY</a><a class="home" href="/">← Back to Home</a></header>
<main class="main"><section class="card">
<div class="mark">S</div><h1>Welcome back</h1><p class="sub">Log in to your SASTIFY account</p>
<form id="loginForm">
<div class="field"><label for="identity">Email address or mobile number</label><input id="identity" type="text" autocomplete="username" placeholder="Enter email or mobile number" required></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required></div>
<button class="submit" id="submit" type="submit">Log In</button>
</form>
<div class="links"><button type="button" id="forgot">Forgot Password?</button><a href="/signup.html">Create account</a></div>
<div class="notice" id="notice" role="alert"></div>
<p class="signup">New to SASTIFY? <a href="/signup.html">Create an account</a></p>
</section></main><footer>© 2026 SASTIFY. All rights reserved.</footer>
<script>
const U='https://eepluqdmtvsvhqxcvtll.supabase.co';
const K=String.fromCharCode(115,98,95,112,117,98,108,105,115,104,97,98,108,101,95,73,121,78,84,55,111,88,56,102,106,68,48,101,106,109,88,115,87,78,57,121,65,95,48,57,104,66,70,107,98,77);
const form=document.getElementById('loginForm'),btn=document.getElementById('submit'),notice=document.getElementById('notice');const pw=document.getElementById('password'),pwWrap=document.createElement('div');pwWrap.className='password-wrap';pw.parentNode.insertBefore(pwWrap,pw);pwWrap.appendChild(pw);const eye=document.createElement('button');eye.type='button';eye.className='password-toggle';eye.textContent='SHOW';pwWrap.appendChild(eye);eye.onclick=()=>{const visible=pw.type==='password';pw.type=visible?'text':'password';eye.textContent=visible?'HIDE':'SHOW'};
let toastTimer;function toast(t,type='success',title){const box=document.getElementById('authToast');box.className=type==='error'?'error show':'show';document.getElementById('authToastTitle').textContent=title||(type==='error'?'Please check':'Done');document.getElementById('authToastText').textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>box.classList.remove('show'),2600)}function message(t){notice.textContent=t;notice.style.display='block';toast(t,'error')}
form.addEventListener('submit',async e=>{
 e.preventDefault();notice.style.display='none';btn.disabled=true;btn.textContent='Logging in…';
 try{
  const identity=document.getElementById('identity').value.trim(),password=document.getElementById('password').value;
  const email=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(identity);
  let phone=identity.replace(/[\s()-]/g,'');
  if(/^01[3-9]\d{8}$/.test(phone))phone='+88'+phone;else if(/^8801[3-9]\d{8}$/.test(phone))phone='+'+phone;
  const payload=email?{email:identity,password}:{phone,password};
  const r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json',apikey:K},body:JSON.stringify(payload)});
  const d=await r.json();
  if(!r.ok)throw new Error(d.msg||d.message||d.error_description||'Login failed. Please check your details and try again.');
  localStorage.setItem('sastify_session',JSON.stringify(d));
  toast('You are now signed in to SASTIFY.','success','Login successful');setTimeout(()=>location.href='/profile.html',650);
 }catch(err){message(err.message||'Network error. Please try again.');}
 finally{btn.disabled=false;btn.textContent='Log In';}
});
document.getElementById('forgot').addEventListener('click',async()=>{
 const email=document.getElementById('identity').value.trim();
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){message('Password reset-er jonno age email address din.');return}
 try{const r=await fetch(U+'/auth/v1/recover',{method:'POST',headers:{'Content-Type':'application/json',apikey:K},body:JSON.stringify({email})});if(!r.ok)throw new Error('Could not send password reset email.');notice.style.background='#eaf7ee';notice.style.color='#176b35';notice.textContent='If this email is registered, a password reset link has been sent.';notice.style.display='block';toast('Password reset instructions have been requested.','success','Request submitted');}
 catch(e){message(e.message||'Network error. Please try again.')}
});
</script>
<div id="authToast" role="status" aria-live="polite"><b id="authToastTitle">Success</b><span id="authToastText"></span></div></body></html>
