<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>My Profile | SASTIFY</title><style>*{box-sizing:border-box}body{margin:0;background:#f0f2f5;color:#1c1e21;font-family:Arial,sans-serif}.nav{height:64px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100% - 950px)/2))}.brand{font-size:25px;font-weight:850;color:#0866ff;text-decoration:none}button{border:0;border-radius:7px;padding:10px 14px;font-weight:bold;cursor:pointer}.wrap{width:min(850px,calc(100% - 28px));margin:28px auto}.card{background:#fff;border:1px solid #dddfe2;border-radius:12px;overflow:hidden}.cover{height:190px;background:linear-gradient(120deg,#dceaff,#eef3fc)}.profile{padding:0 24px 25px}.avatar{width:124px;height:124px;border-radius:50%;border:5px solid white;background:#e4eaf2;object-fit:cover;margin-top:-62px}.name{font-size:26px;margin:8px 0 3px}.username{color:#65676b;margin:0 0 20px}.grid{border-top:1px solid #e4e6eb;padding-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:16px}.item{font-size:14px;color:#65676b}.item b{display:block;color:#1c1e21;margin-bottom:5px}.hint{font-size:13px;color:#65676b;margin-top:20px}.home{display:inline-block;margin-top:10px;background:#0866ff;color:#fff;text-decoration:none;padding:11px 15px;border-radius:7px;font-weight:bold;font-size:14px}@media(max-width:520px){.cover{height:145px}.profile{padding:0 16px 20px}.grid{grid-template-columns:1fr}}</style></head><body><header class="nav"><a class="brand" href="/">SASTIFY</a><button id="logout">Log out</button></header><main class="wrap"><section class="card"><div class="cover"></div><div class="profile"><img class="avatar" id="avatar" alt="Profile photo"><h1 class="name" id="name">SASTIFY Member</h1><p class="username" id="username"></p><div class="grid"><div class="item"><b>Birthday</b><span id="birthday">Not added</span></div><div class="item"><b>Gender</b><span id="gender">Not added</span></div><div class="item"><b>Email</b><span id="email"></span></div><div class="item"><b>Mobile</b><span id="phone">Not added</span></div></div><p class="hint">Welcome to SASTIFY. You can add or update more profile details as new features become available.</p><a class="home" href="/">Go to SASTIFY Home</a><a class="home" id="adminLink" href="/admin.html" style="display:none;margin-left:8px;background:#174ea6">Open Admin Panel</a></div></section></main><script>const U='https://eepluqdmtvsvhqxcvtll.supabase.co',K=String.fromCharCode(115,98,95,112,117,98,108,105,115,104,97,98,108,101,95,73,121,78,84,55,111,88,56,102,106,68,48,101,106,109,88,115,87,78,57,121,65,95,48,57,104,66,70,107,98,77);let s;try{s=JSON.parse(localStorage.getItem('sastify_session')||'null')}catch{}if(!s||!s.access_token){location.href='/signup.html'}else{const u=s.user||{},m=u.user_metadata||{};document.getElementById('name').textContent=m.full_name||'SASTIFY Member';document.getElementById('username').textContent=m.username?'@'+m.username:'';document.getElementById('birthday').textContent=m.birthday||'Not added';document.getElementById('gender').textContent=m.gender||'Not added';document.getElementById('email').textContent=u.email||'';document.getElementById('phone').textContent=m.phone||'Not added';if(m.avatar_url){document.getElementById('avatar').src=m.avatar_url}else{const svg='<svg xmlns="http://www.w3.org/2000/svg" width="124" height="124"><rect width="100%" height="100%" fill="#e4eaf2"/><text x="50%" y="58%" text-anchor="middle" font-size="46" fill="#7d8ba0">S</text></svg>';document.getElementById('avatar').src='data:image/svg+xml,'+encodeURIComponent(svg)}fetch(U+'/rest/v1/admin_access?select=user_id&user_id=eq.'+encodeURIComponent(u.id),{headers:{apikey:K,Authorization:'Bearer '+s.access_token}}).then(r=>r.ok?r.json():[]).then(rows=>{if(Array.isArray(rows)&&rows.some(x=>x.user_id===u.id))document.getElementById('adminLink').style.display='inline-block'}).catch(()=>{})}document.getElementById('logout').onclick=async()=>{try{await fetch(U+'/auth/v1/logout',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+s.access_token}})}catch{}localStorage.removeItem('sastify_session');location.href='/'};</script></body></html>
